<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · SiteForge</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f2;color:#20231f;font:15px system-ui,Segoe UI,sans-serif}.card{width:min(410px,calc(100% - 32px));background:white;border:1px solid #e6e9e2;border-radius:16px;padding:32px;box-shadow:0 16px 55px #25291c10}.mark{width:36px;height:36px;display:grid;place-items:center;background:#c9f36a;border-radius:10px;font-weight:800}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.tag{font-size:10px;letter-spacing:1.5px;color:#7d8277;margin-top:32px}h1{font-size:25px;margin:8px 0}p{font-size:13px;color:#777d72;line-height:1.5}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #dfe3da;border-radius:8px;font:inherit}.field input:focus{outline:3px solid #c9f36a55;border-color:#9fc24f}button{width:100%;padding:12px;background:#22251f;border:0;border-radius:8px;color:white;font-weight:700;cursor:pointer}.error{min-height:20px;color:#b34d42;font-size:12px;margin-top:12px}</style></head><body><main class="card"><div class="brand"><span class="mark">✳</span>siteforge <small style="font-size:10px;color:#858a80">ADMIN</small></div><div class="tag">MASTER ADMIN</div><h1>Sign in to admin</h1><p>Gunakan akun master admin yang dikonfigurasi untuk project Cloudflare.</p><form id="login"><div class="field"><label for="email">Email admin</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button>Sign in</button><div class="error" id="error" role="alert"></div></form></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Login gagal.');location.href='/admin.html'}catch(err){error.textContent=err.message}})</script></body></html>
